  <circle cx="50" cy="44" r="9" fill="#fdf9ee" stroke="#0a0a0a" stroke-width="2"/>
  <path d="M41 44 A9 9 0 0 1 59 44 Z" fill="#ee1515" stroke="#0a0a0a" stroke-width="1.5"/>
